<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <defs>
    <clipPath id="roundedBg">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#roundedBg)">
    <rect x="0" y="0" width="512" height="512" fill="#050505"/>
    <g stroke="#1a1a1a" stroke-width="1" opacity="0.55">
      <line x1="0" y1="40" x2="512" y2="40"/>
      <line x1="0" y1="80" x2="512" y2="80"/>
      <line x1="0" y1="120" x2="512" y2="120"/>
      <line x1="0" y1="160" x2="512" y2="160"/>
      <line x1="0" y1="200" x2="512" y2="200"/>
      <line x1="0" y1="240" x2="512" y2="240"/>
      <line x1="0" y1="280" x2="512" y2="280"/>
      <line x1="0" y1="320" x2="512" y2="320"/>
      <line x1="0" y1="360" x2="512" y2="360"/>
      <line x1="0" y1="400" x2="512" y2="400"/>
      <line x1="0" y1="440" x2="512" y2="440"/>
      <line x1="0" y1="480" x2="512" y2="480"/>
      <line x1="40" y1="0" x2="40" y2="512"/>
      <line x1="80" y1="0" x2="80" y2="512"/>
      <line x1="120" y1="0" x2="120" y2="512"/>
      <line x1="160" y1="0" x2="160" y2="512"/>
      <line x1="200" y1="0" x2="200" y2="512"/>
      <line x1="240" y1="0" x2="240" y2="512"/>
      <line x1="280" y1="0" x2="280" y2="512"/>
      <line x1="320" y1="0" x2="320" y2="512"/>
      <line x1="360" y1="0" x2="360" y2="512"/>
      <line x1="400" y1="0" x2="400" y2="512"/>
      <line x1="440" y1="0" x2="440" y2="512"/>
      <line x1="480" y1="0" x2="480" y2="512"/>
    </g>

    <!-- soft glow behind body -->
    <rect x="96" y="96" width="320" height="320" fill="#ff3366" filter="url(#glow)" opacity="0.65"/>

    <!-- Unit 734 body: flat square, proportions match in-game 26x26 unit exactly -->
    <rect x="96" y="96" width="320" height="320" fill="#ff3366" shape-rendering="crispEdges"/>

    <!-- eyes: 5x5 at (5,7) and (16,7) relative to a 26x26 body, scaled -->
    <rect x="157.54" y="182.15" width="61.54" height="61.54" fill="#ffffff" shape-rendering="crispEdges"/>
    <rect x="292.92" y="182.15" width="61.54" height="61.54" fill="#ffffff" shape-rendering="crispEdges"/>
  </g>
</svg>
